name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  security-events: write  # upload SARIF reports to GitHub Security tab

jobs:
  # ── Security scanning (runs on every push/PR, blocks release) ─────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secret detection — scans full git history
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Known CVEs in npm dependencies (generate lockfile first — project uses bun.lockb)
      - name: npm audit (HIGH + CRITICAL)
        run: |
          npm install --package-lock-only --ignore-scripts --silent
          npm audit --audit-level=high
        continue-on-error: true   # informational — don't block release for transitive CVEs

      # Filesystem vulnerability scan — uploads SARIF to GitHub Security tab
      - name: Trivy (dependency + config scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

      # SAST — TypeScript static analysis via Semgrep community rules
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/secrets
            p/command-injection
        continue-on-error: true   # community rules may have false positives

  # ── Build, release, publish (tags only, after security passes) ────────────
  build-and-release:
    name: Build, Release & Publish
    needs: security
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          jq ".version = \"$VERSION\"" package.json > tmp.json && mv tmp.json package.json

      - name: Build all targets
        run: |
          mkdir -p dist
          bun build --compile --target=bun-linux-x64    src/cli.tsx --outfile dist/homelab-tui-linux-x64
          bun build --compile --target=bun-linux-arm64  src/cli.tsx --outfile dist/homelab-tui-linux-arm64
          bun build --compile --target=bun-darwin-x64   src/cli.tsx --outfile dist/homelab-tui-darwin-x64
          bun build --compile --target=bun-darwin-arm64 src/cli.tsx --outfile dist/homelab-tui-darwin-arm64
          bun build --compile --target=bun-windows-x64  src/cli.tsx --outfile dist/homelab-tui-windows-x64.exe
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/homelab-tui-linux-x64
            dist/homelab-tui-linux-arm64
            dist/homelab-tui-darwin-x64
            dist/homelab-tui-darwin-arm64
            dist/homelab-tui-windows-x64.exe

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          jq --arg v "$VERSION" '.version = $v' npm/main/package.json > tmp.json
          mv tmp.json npm/main/package.json
          echo "Publishing homelab-tui@$VERSION"
          PUBLISHED=$(npm view homelab-tui@$VERSION version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "homelab-tui@$VERSION is already published — skipping."
            exit 0
          fi
          npm publish ./npm/main --access public
