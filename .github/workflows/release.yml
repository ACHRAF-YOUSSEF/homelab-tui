name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Bump root package.json (used by cli.tsx import)
          jq ".version = \"$VERSION\"" package.json > tmp.json && mv tmp.json package.json

      - name: Build all targets
        run: |
          mkdir -p dist
          bun build --compile --target=bun-linux-x64    src/cli.tsx --outfile dist/homelab-tui-linux-x64
          bun build --compile --target=bun-linux-arm64  src/cli.tsx --outfile dist/homelab-tui-linux-arm64
          bun build --compile --target=bun-darwin-x64   src/cli.tsx --outfile dist/homelab-tui-darwin-x64
          bun build --compile --target=bun-darwin-arm64 src/cli.tsx --outfile dist/homelab-tui-darwin-arm64
          bun build --compile --target=bun-windows-x64  src/cli.tsx --outfile dist/homelab-tui-windows-x64.exe
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/homelab-tui-linux-x64
            dist/homelab-tui-linux-arm64
            dist/homelab-tui-darwin-x64
            dist/homelab-tui-darwin-arm64
            dist/homelab-tui-windows-x64.exe

      - name: Publish platform packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for PLATFORM in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            EXT=""
            [ "$PLATFORM" = "windows-x64" ] && EXT=".exe"

            mkdir -p npm/platforms/$PLATFORM/bin
            cp dist/homelab-tui-$PLATFORM$EXT npm/platforms/$PLATFORM/bin/homelab-tui$EXT
            chmod +x npm/platforms/$PLATFORM/bin/homelab-tui$EXT 2>/dev/null || true

            jq ".version = \"$VERSION\"" npm/platforms/$PLATFORM/package.json > tmp.json
            mv tmp.json npm/platforms/$PLATFORM/package.json

            npm publish npm/platforms/$PLATFORM --access public
          done

      - name: Publish main package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Sync all optionalDependency versions to match the release
          jq ".version = \"$VERSION\" | .optionalDependencies = (.optionalDependencies | map_values(\"$VERSION\"))" \
            npm/main/package.json > tmp.json && mv tmp.json npm/main/package.json

          npm publish npm/main --access public
