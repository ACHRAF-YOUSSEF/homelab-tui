name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Bump root package.json (used by cli.tsx import)
          jq ".version = \"$VERSION\"" package.json > tmp.json && mv tmp.json package.json

      - name: Build all targets
        run: |
          mkdir -p dist
          bun build --compile --target=bun-linux-x64    src/cli.tsx --outfile dist/homelab-tui-linux-x64
          bun build --compile --target=bun-linux-arm64  src/cli.tsx --outfile dist/homelab-tui-linux-arm64
          bun build --compile --target=bun-darwin-x64   src/cli.tsx --outfile dist/homelab-tui-darwin-x64
          bun build --compile --target=bun-darwin-arm64 src/cli.tsx --outfile dist/homelab-tui-darwin-arm64
          bun build --compile --target=bun-windows-x64  src/cli.tsx --outfile dist/homelab-tui-windows-x64.exe
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/homelab-tui-linux-x64
            dist/homelab-tui-linux-arm64
            dist/homelab-tui-darwin-x64
            dist/homelab-tui-darwin-arm64
            dist/homelab-tui-windows-x64.exe

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          jq --arg v "$VERSION" '.version = $v' npm/main/package.json > tmp.json
          mv tmp.json npm/main/package.json
          echo "Publishing homelab-tui@$VERSION"
          PUBLISHED=$(npm view homelab-tui@$VERSION version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "homelab-tui@$VERSION is already published — skipping."
            exit 0
          fi
          npm publish ./npm/main --access public
