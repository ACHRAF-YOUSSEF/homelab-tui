name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump version in src/cli.tsx
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s/const VERSION = \".*\"/const VERSION = \"$VERSION\"/" src/cli.tsx

      - name: Build all targets
        run: |
          mkdir -p dist
          EXT="--external react-devtools-core"
          bun build --compile --target=bun-linux-x64    $EXT src/cli.tsx --outfile dist/homelab-tui-linux-x64
          bun build --compile --target=bun-linux-arm64  $EXT src/cli.tsx --outfile dist/homelab-tui-linux-arm64
          bun build --compile --target=bun-darwin-x64   $EXT src/cli.tsx --outfile dist/homelab-tui-darwin-x64
          bun build --compile --target=bun-darwin-arm64 $EXT src/cli.tsx --outfile dist/homelab-tui-darwin-arm64
          bun build --compile --target=bun-windows-x64  $EXT src/cli.tsx --outfile dist/homelab-tui-windows-x64.exe
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/homelab-tui-linux-x64
            dist/homelab-tui-linux-arm64
            dist/homelab-tui-darwin-x64
            dist/homelab-tui-darwin-arm64
            dist/homelab-tui-windows-x64.exe
